<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reisekosten</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f4e79">
<style>
:root{--bg:#f2f2f7;--c:#fff;--t:#111;--a:#1f4e79;--l:#ccc}
@media(prefers-color-scheme:dark){:root{--bg:#000;--c:#1c1c1e;--t:#eee;--a:#6aa9e0;--l:#444}}
body{margin:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 40px;background:var(--bg);color:var(--t);font:16px -apple-system,sans-serif}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:14px;text-transform:uppercase;color:var(--a);margin:0 0 8px}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;margin:8px 0 3px;opacity:.7}
input,select{width:100%;box-sizing:border-box;font-size:16px;padding:9px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t)}
.dayh{font-weight:600;margin-top:10px}.r{display:flex;gap:8px}.r>div{flex:1}
.ck{display:flex;align-items:center;gap:10px;font-size:17px;margin:12px 0 4px;opacity:1}.ck input{width:24px;height:24px}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:var(--a);color:#fff}
#pv{font-size:13px;width:100%;border-collapse:collapse}#pv td,#pv th{padding:3px;text-align:right;border-bottom:1px solid var(--l)}#pv td:first-child,#pv th:first-child{text-align:left}
</style></head><body>
<h1>Reisekosten</h1>
<div class="card"><h2>Einstellungen</h2>
<label>Name</label><input id="name" autocomplete="name">
<label>Abteilung</label><input id="abt">
<label>Firmenstandort</label><input id="firma">
<label>Spesensatz 24h (€)</label><input id="satz" inputmode="decimal"></div>
<div class="card"><h2>Fahrten (max. 5 Tage)</h2>
<label>Wie viele Fahrten zum Kunden?</label><select id="nf"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<div id="trips"></div>
<label>Tätigkeit</label><input id="taet">
<label class="ck"><input type="checkbox" id="sp" checked> Spesen?</label></div>
<div class="card"><h2>Kosten pro Tag</h2><div id="days"></div></div>
<div class="card"><h2>Vorschau</h2><div id="pv" style="overflow-x:auto"></div></div>
<button id="go">PDF erstellen</button>
<p style="text-align:center;opacity:.5;font-size:12px">Version 3</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=i=>document.getElementById(i),N=v=>parseFloat(String(v||'').replace(',','.'))||0,costs={};
['name','abt','firma','satz'].forEach(k=>{try{$(k).value=localStorage.getItem(k)||''}catch(e){}$(k).addEventListener('input',()=>{try{localStorage.setItem(k,$(k).value)}catch(e){}})});
const p2=n=>('0'+n).slice(-2),dd=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(-2),tt=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const fD=i=>{i.value=i.value.replace(/\D/g,'').slice(0,6).replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2}\.\d{2})(\d)/,'$1.$2')};
const fT=i=>{i.value=i.value.replace(/\D/g,'').slice(0,4).replace(/^(\d{2})(\d)/,'$1:$2')};
function mk(dv,tv){const a=/^(\d\d)\.(\d\d)\.(\d\d)$/.exec(dv),b=/^(\d\d):(\d\d)$/.exec(tv);if(!a||!b||+b[1]>23||+b[2]>59)return null;
 const d=new Date(2000+ +a[3],a[2]-1,+a[1],+b[1],+b[2]);return d.getDate()==+a[1]&&d.getMonth()==a[2]-1?d:null}
const eur=v=>{v=Math.round(v*100)/100;return Number.isInteger(v)?v+',-':v.toFixed(2).replace('.',',')};
const hh=h=>String(Math.round(h*100)/100).replace('.',',');
const def=p=>{const t=p?p.ed:dd(new Date());return{sd:t,st:'08:00',ed:t,et:'17:00',z:''}};
const TR=[def()];
function renderTrips(){$('trips').innerHTML=TR.map((t,i)=>{const a=(l,f,m)=>'<div><label>'+l+'</label><input inputmode="numeric" maxlength="'+(m?5:8)+'" placeholder="'+(m?'HH:MM':'TT.MM.JJ')+'" '+(m?'data-m="1"':'data-d="1"')+' data-i="'+i+'" data-f="'+f+'" value="'+t[f]+'"></div>';
 return '<div class="dayh">Fahrt '+(i+1)+'</div><div class="r">'+a('Beginn Datum','sd')+a('Beginn Zeit (24h)','st',1)+'</div><div class="r">'+a('Ende Datum','ed')+a('Ende Zeit (24h)','et',1)+'</div><label>Ziel</label><input data-i="'+i+'" data-f="z" value="'+t.z+'">'}).join('')}
function calc(){
 const rate=N($('satz').value),sp=$('sp').checked,F=[];
 for(const t of TR){const s=mk(t.sd,t.st),e=mk(t.ed,t.et);if(!s||!e||e<=s)return null;F.push({s,e,z:t.z})}
 F.sort((a,b)=>a.s-b.s);
 for(let i=1;i<F.length;i++)if(F[i].s<F[i-1].e)return{err:'Fahrten überschneiden sich.'};
 const M=new Map();
 for(const f of F){let d0=new Date(f.s.getFullYear(),f.s.getMonth(),f.s.getDate()),first=true;
  while(d0<f.e){const d1=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1),a=f.s>d0?f.s:d0,b=f.e<d1?f.e:d1,k=d0.getTime();
   let m=M.get(k);if(!m){if(M.size>=5)return{err:'Maximal 5 Tage möglich.'};m={d:d0,d1,ms:0,from:a,to:b,over:false,routes:[]};M.set(k,m)}
   m.ms+=b-a;if(a<m.from)m.from=a;if(b>m.to)m.to=b;if(f.s<d0)m.over=true;if(first)m.routes.push(f.z);first=false;d0=d1}}
 const rows=[...M.values()].sort((x,y)=>x.d-y.d).map(m=>{
  const h=m.ms/36e5,full=m.ms==m.d1-m.d,v=sp?(full?rate:h>8?rate/2:0):0,u=sp&&m.over?-rate*0.2:0,c=costs[dd(m.d)]||{},f=N(c.f),o=N(c.o);
  return{d:m.d,from:tt(m.from),to:m.to.getTime()==m.d1.getTime()?'24:00':tt(m.to),h,v,u,f,o,sum:v+u+f+o,routes:m.routes}});
 return{s:F[0].s,e:F[F.length-1].e,rows};
}
let dk='';
function renderDays(){const r=calc(),k=r&&!r.err?r.rows.map(x=>dd(x.d)):[];if(k.join()===dk)return;dk=k.join();
 $('days').innerHTML=k.length?k.map(d=>{const c=costs[d]||{};return '<div class="dayh">'+d+'</div><div class="r"><div><label>Fahrtkosten (€)</label><input inputmode="decimal" data-k="'+d+'" data-t="f" value="'+(c.f||'')+'"></div><div><label>Sonstige Kosten (€)</label><input inputmode="decimal" data-k="'+d+'" data-t="o" value="'+(c.o||'')+'"></div></div>'}).join(''):'<label>Bitte Fahrten vollständig eingeben.</label>'}
function prev(){const r=calc(),t=$('pv');
 if(!r){t.textContent='Bitte Datum (TT.MM.JJ) und Zeit (HH:MM) prüfen.';return}
 if(r.err){t.textContent=r.err;return}
 const T=k=>r.rows.reduce((a,x)=>a+x[k],0),z=v=>v?eur(v):'';
 t.innerHTML='<table id="pv"><tr><th>Datum</th><th>Std.</th><th>Verpfl.</th><th>Übern.</th><th>Fahrt</th><th>Sonst.</th><th>Summe</th></tr>'+r.rows.map(x=>'<tr><td>'+dd(x.d)+'</td><td>'+hh(x.h)+'</td><td>'+z(x.v)+'</td><td>'+z(x.u)+'</td><td>'+z(x.f)+'</td><td>'+z(x.o)+'</td><td>'+eur(x.sum)+'</td></tr>').join('')+'<tr><th>Gesamt</th><th></th><th>'+z(T('v'))+'</th><th>'+z(T('u'))+'</th><th>'+z(T('f'))+'</th><th>'+z(T('o'))+'</th><th>'+eur(T('sum'))+'</th></tr></table>'}
document.addEventListener('input',ev=>{const i=ev.target,d=i.dataset;
 if(d.d)fD(i);else if(d.m)fT(i);
 if(d.i!==undefined)TR[d.i][d.f]=i.value;else if(d.k)(costs[d.k]=costs[d.k]||{})[d.t]=i.value;
 renderDays();prev()});
$('nf').onchange=()=>{const n=+$('nf').value;while(TR.length<n)TR.push(def(TR[TR.length-1]));TR.length=n;renderTrips();renderDays();prev()};
renderTrips();renderDays();prev();
function build(r){
 const doc=new jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),T=(s,x,y,o)=>doc.text(String(s),x,y,o);
 const H=[['Datum'],['Reise-Beginn/','Ende'],['Reisezweck und besuchte','Firmen bzw. Orte'],['Std.'],['Verpflegung','pauschal'],['Übernachtung','o. Frühst.'],['Fahrtkosten'],['Sonstiges','(Einzelnachweis)'],['Summe']];
 const SM=['00.00.00','24:00','','00,00','-000,00','-000,00','0000,00','0000,00','0000,00'];
 const W=H.map((h,i)=>{doc.setFont('helvetica','normal');doc.setFontSize(6.5);const a=Math.max(...h.map(s=>doc.getTextWidth(s)));doc.setFontSize(7.5);return Math.max(a,doc.getTextWidth(SM[i]))+2.6});
 W[2]=197-W.reduce((a,b,i)=>i==2?a:a+b,0);
 const X=[8];W.forEach((w,i)=>X.push(X[i]+w));const R=X[9];
 doc.setLineWidth(.2);doc.setFont('helvetica','normal');
 doc.setFontSize(6);T('Name',8,8);T('Abteilung',75,8);T('vom',8,19);T('bis',75,19);T('Beleg-Nr.',118,23);T('Währung',172,23);
 doc.setFontSize(10);doc.setFont('helvetica','bold');T($('name').value,8,12.5);T($('abt').value,75,12.5);T(dd(r.s),8,23.5);T(dd(r.e),75,23.5);T('EUR',185,23.5);
 doc.setFontSize(13);T('Reisekosten-Abrechnung',118,13);
 const y0=27,yh=37,yb=95;doc.rect(8,y0,R-8,yb-y0);doc.line(8,yh,R,yh);
 for(let i=1;i<=8;i++)doc.line(X[i],y0,X[i],yb);
 doc.setFont('helvetica','normal');doc.setFontSize(6.5);
 H.forEach((c,i)=>c.forEach((s,j)=>T(s,X[i]+1.3,y0+4+j*3.6)));
 const firma=$('firma').value,L=r.rows.reduce((a,x)=>a+Math.max(2,x.routes.length),0),lh=Math.min(3.8,44/L);
 let t=yh;
 r.rows.forEach(x=>{const n=Math.max(2,x.routes.length),y1=t+lh-.7,y2=t+2*lh-.7;
  doc.setFontSize(7.5);
  T(dd(x.d),X[0]+1.3,y1);T(x.from,X[1]+1.3,y1);T(x.to,X[1]+1.3,y2);
  x.routes.forEach((z,j)=>{const s=firma+'—'+z+'—'+firma;let f=7.5;doc.setFontSize(f);while(doc.getTextWidth(s)>W[2]-2.6&&f>4.5){f-=.3;doc.setFontSize(f)}T(s,X[2]+1.3,t+(j+1)*lh-.7)});
  doc.setFontSize(7.5);
  T(hh(x.h),X[4]-1.3,y1,{align:'right'});
  [[4,x.v],[5,x.u],[6,x.f],[7,x.o]].forEach(([c,v])=>{if(v)T(eur(v),X[c+1]-1.3,y1,{align:'right'})});
  T(eur(x.sum),R-1.3,y1,{align:'right'});t+=n*lh});
 doc.setFontSize(7);doc.splitTextToSize($('taet').value,W[2]-2.6).reverse().forEach((s,j)=>T(s,X[2]+1.3,yb-2-j*3.2));
 const tot=k=>r.rows.reduce((a,x)=>a+x[k],0);
 doc.setFontSize(8);doc.setFont('helvetica','bold');doc.rect(8,yb,R-8,6);T('Gesamtsumme',9,yb+4.2);
 [[4,'v'],[5,'u'],[6,'f'],[7,'o'],[8,'sum']].forEach(([c,k])=>{const v=tot(k);if(v)T(eur(v),X[c+1]-1.3,yb+4.2,{align:'right'})});
 doc.setFont('helvetica','normal');doc.setFontSize(7);
 doc.rect(8,yb+6,R-8,6);T('./. RK-Vorschuss',9,yb+10.2);
 doc.rect(8,yb+12,R-8,6);T('Auszahlung / Rückzahlung',9,yb+16.2);doc.setFont('helvetica','bold');T(eur(tot('sum')),R-1.3,yb+16.2,{align:'right'});
 doc.setFont('helvetica','normal');doc.rect(8,yb+18,R-8,23);doc.line(78,yb+18,78,yb+41);doc.line(148,yb+18,148,yb+41);
 doc.setFontSize(6.5);T('Abrechnung erstellt / Betrag richtig erhalten',9,yb+21.5);T('geprüft / Zahlungsanweisung',79,yb+21.5);T('Buchungsvermerke',149,yb+21.5);
 return doc;}
$('go').onclick=async()=>{const r=calc();if(!r||r.err){alert(r?r.err:'Bitte Datum und Zeit prüfen.');return}
 const doc=build(r),blob=doc.output('blob'),f=new File([blob],'Reisekosten_'+dd(r.s)+'.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
 window.open(URL.createObjectURL(blob),'_blank');};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
</script></body></html>
